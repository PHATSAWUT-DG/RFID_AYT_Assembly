info:
  name: Locations - Update
  type: http
  seq: 7

http:
  method: PUT
  url: "{{urlPrefix}}/api/assembly/locations/4"
  body:
    type: json
    data: |-
      {
        "location_code": "gr_f2",
        "location_name": "Gauging Room F2",
        "process_id": 1,
        "is_active": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Update a location by id. Send the full body (same fields as Create). Returns the updated row.
  `is_active` is required here (Create defaults it to true). A missing field is a 400.
  There is no delete. To retire a location, send `"is_active": false` (as in this example).
  `:id` must be a positive integer.

  ### 200 Updated
  ```json
  {
    "data": {
      "id": 4, "location_code": "gr_f2", "location_name": "Gauging Room F2",
      "process_id": 1, "is_active": false, "created_at": "2026-10-27T03:00:00.000Z"
    }
  }
  ```

  ### 400 VALIDATION_ERROR
  Bad or incomplete body (e.g. `is_active` missing), or `:id` is not a positive integer.
  ```json
  {
    "error": {
      "code": "VALIDATION_ERROR",
      "message": "Request validation failed",
      "details": [{ "in": "params", "path": "id", "message": "Invalid input: expected number, received NaN" }],
      "request_id": "3f6c1b0e-0000-4000-8000-000000000001"
    }
  }
  ```

  ### 404 MASTER_NOT_FOUND
  ```json
  { "error": { "code": "MASTER_NOT_FOUND", "message": "Location 99 not found", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```

  ### 409 MASTER_DUPLICATE
  ```json
  {
    "error": {
      "code": "MASTER_DUPLICATE",
      "message": "Location code already exists",
      "details": [{ "in": "body", "path": "location_code", "message": "Location code already exists" }],
      "request_id": "3f6c1b0e-0000-4000-8000-000000000001"
    }
  }
  ```

  ### 422 MASTER_INVALID_REF
  ```json
  {
    "error": {
      "code": "MASTER_INVALID_REF",
      "message": "Process does not exist",
      "details": [{ "in": "body", "path": "process_id", "message": "Process does not exist" }],
      "request_id": "3f6c1b0e-0000-4000-8000-000000000001"
    }
  }
  ```
