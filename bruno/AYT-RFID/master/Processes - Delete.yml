info:
  name: Processes - Delete
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{urlPrefix}}/api/assembly/processes/2"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Delete a process by id. A process that still has locations cannot be deleted.

  ### 204 Deleted
  Empty body.

  ### 400 VALIDATION_ERROR
  `:id` is not a positive integer.
  ```json
  {
    "error": {
      "code": "VALIDATION_ERROR",
      "message": "Request validation failed",
      "details": [{ "in": "params", "path": "id", "message": "Invalid input: expected number, received NaN" }],
      "request_id": "3f6c1b0e-0000-4000-8000-000000000001"
    }
  }
  ```

  ### 404 MASTER_NOT_FOUND
  ```json
  { "error": { "code": "MASTER_NOT_FOUND", "message": "Process 99 not found", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```

  ### 409 MASTER_IN_USE
  ```json
  { "error": { "code": "MASTER_IN_USE", "message": "Process is still used by a location", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```
