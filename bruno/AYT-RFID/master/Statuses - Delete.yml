info:
  name: Statuses - Delete
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{urlPrefix}}/api/assembly/statuses/5"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Delete a status by id. A system status (`REGISTERED`, `CLEARED`) cannot be deleted.
  A status that a lot or an event still uses cannot be deleted either.

  ### 204 Deleted
  Empty body.

  ### 400 VALIDATION_ERROR
  `:id` is not a positive integer.
  ```json
  {
    "error": {
      "code": "VALIDATION_ERROR",
      "message": "Request validation failed",
      "details": [{ "in": "params", "path": "id", "message": "Invalid input: expected number, received NaN" }],
      "request_id": "3f6c1b0e-0000-4000-8000-000000000001"
    }
  }
  ```

  ### 404 MASTER_NOT_FOUND
  ```json
  { "error": { "code": "MASTER_NOT_FOUND", "message": "Status 99 not found", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```

  ### 409 MASTER_SYSTEM_LOCKED
  System status:
  ```json
  { "error": { "code": "MASTER_SYSTEM_LOCKED", "message": "System status CLEARED cannot be deleted", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```
  Used by a lot or an event:
  ```json
  { "error": { "code": "MASTER_IN_USE", "message": "Status is still used by a lot or an event", "request_id": "3f6c1b0e-0000-4000-8000-000000000001" } }
  ```
